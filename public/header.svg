<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Gradient for AFPL text -->
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8788a">
        <animate attributeName="stop-color" values="#e8788a;#f5c542;#e8788a" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f5c542">
        <animate attributeName="stop-color" values="#f5c542;#e8788a;#f5c542" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e8788a">
        <animate attributeName="stop-color" values="#e8788a;#f5c542;#e8788a" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/></feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e8788a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0a0a0f"/>

  <!-- Ambient blobs -->
  <circle cx="200" cy="120" r="180" fill="#e8788a" opacity="0.02" filter="url(#softglow)">
    <animate attributeName="r" values="180;200;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.02;0.04;0.02" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="150" fill="#f5c542" opacity="0.015" filter="url(#softglow)">
    <animate attributeName="r" values="150;170;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.015;0.03;0.015" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid floor (fading) -->
  <g opacity="0.3">
    <rect x="0" y="180" width="900" height="140" fill="url(#grid)"/>
    <rect x="0" y="180" width="900" height="140" fill="url(#fade)"/>
  </g>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0a0f" stop-opacity="1"/>
    <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="180" width="900" height="140" fill="url(#fade)"/>

  <!-- Orbit ring 1 -->
  <circle cx="450" cy="145" r="120" fill="none" stroke="#e8788a" stroke-width="0.5" opacity="0.08"/>

  <!-- Orbit ring 2 -->
  <circle cx="450" cy="145" r="85" fill="none" stroke="#f5c542" stroke-width="0.4" opacity="0.06"/>

  <!-- Orbiting dots - ring 1 -->
  <circle r="3" fill="#e8788a" opacity="0.5" filter="url(#glow)">
    <animateMotion dur="22s" repeatCount="indefinite" path="M450,145 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0" additive="sum"/>
  </circle>
  <circle r="2.5" fill="#f5c542" opacity="0.4" filter="url(#glow)">
    <animateMotion dur="22s" begin="-5.5s" repeatCount="indefinite" path="M450,145 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0" additive="sum"/>
  </circle>
  <circle r="2" fill="#e8788a" opacity="0.35" filter="url(#glow)">
    <animateMotion dur="22s" begin="-11s" repeatCount="indefinite" path="M450,145 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0" additive="sum"/>
  </circle>
  <circle r="2.5" fill="#f5c542" opacity="0.3" filter="url(#glow)">
    <animateMotion dur="22s" begin="-16.5s" repeatCount="indefinite" path="M450,145 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0" additive="sum"/>
  </circle>

  <!-- Orbiting dots - ring 2 (reverse) -->
  <circle r="2.5" fill="#e8788a" opacity="0.4" filter="url(#glow)">
    <animateMotion dur="16s" repeatCount="indefinite" path="M450,145 m85,0 a85,85 0 1,0 -170,0 a85,85 0 1,0 170,0" additive="sum"/>
  </circle>
  <circle r="2" fill="#f5c542" opacity="0.35" filter="url(#glow)">
    <animateMotion dur="16s" begin="-5.3s" repeatCount="indefinite" path="M450,145 m85,0 a85,85 0 1,0 -170,0 a85,85 0 1,0 170,0" additive="sum"/>
  </circle>
  <circle r="2" fill="#e8788a" opacity="0.3" filter="url(#glow)">
    <animateMotion dur="16s" begin="-10.6s" repeatCount="indefinite" path="M450,145 m85,0 a85,85 0 1,0 -170,0 a85,85 0 1,0 170,0" additive="sum"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="80" r="1.5" fill="#e8788a" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" r="1" fill="#f5c542" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="11s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="11s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" r="1.5" fill="#e8788a" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="8s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="8s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" r="1" fill="#f5c542" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="10s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="10s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" r="1.5" fill="#e8788a" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="12s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="12s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" r="1" fill="#f5c542" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="9s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="9s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" r="1" fill="#e8788a" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="10s" begin="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0.3;0" dur="10s" begin="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" r="1.5" fill="#f5c542" opacity="0">
    <animate attributeName="cy" values="320;-10" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center glow ring -->
  <circle cx="450" cy="145" r="45" fill="none" stroke="#e8788a" stroke-width="1.5" opacity="0.08" filter="url(#glow2)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="44;47;44" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- AFPL Text -->
  <text x="450" y="155" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="64" fill="url(#tg)" letter-spacing="-1">
    AFPL
  </text>

  <!-- Subtitle -->
  <text x="450" y="195" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555" letter-spacing="4">
    ENTER MY WORLD
  </text>

  <!-- Arrow hint -->
  <text x="450" y="260" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" fill="#e8788a" opacity="0.4">
    ↓
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Top line accent -->
  <line x1="350" y1="0" x2="550" y2="0" stroke="url(#tg)" stroke-width="2" opacity="0.6"/>

  <!-- Bottom line accent -->
  <line x1="380" y1="320" x2="520" y2="320" stroke="url(#tg)" stroke-width="1" opacity="0.3"/>
</svg>
