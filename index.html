<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFPL - Portfolio</title>
    <meta name="description" content="AFPL Developer Portfolio — Automating the ordinary ⚡" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', sans-serif;
        background: #0a0a0f;
        color: #e2e8f0;
        overflow-x: hidden;
        transition: background 0.4s ease, color 0.4s ease;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a0f; }
      ::-webkit-scrollbar-thumb { background: #e8788a44; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #e8788a88; }

      /* Prevent gradient text from inheriting color/background transitions — fixes WebKit rendering bug */
      [data-gradient-text] {
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        color: transparent !important;
        transition-property: opacity, transform, filter !important;
      }

      /* Scanlines & CRT screen effect */
      .crt-overlay {
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 4px, 6px 100%;
        opacity: 0.15;
      }
      .crt-overlay::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
      }

      @keyframes text-glow {
        0%, 100% { text-shadow: 0 0 8px rgba(255, 42, 95, 0.3), 0 0 15px rgba(255, 42, 95, 0.1); }
        50% { text-shadow: 0 0 15px rgba(255, 42, 95, 0.6), 0 0 30px rgba(255, 42, 95, 0.2); }
      }

      @keyframes border-glow-pink {
        0%, 100% { border-color: rgba(255, 42, 95, 0.2); box-shadow: 0 0 10px rgba(255, 42, 95, 0.05); }
        50% { border-color: rgba(255, 42, 95, 0.6); box-shadow: 0 0 20px rgba(255, 42, 95, 0.2); }
      }

      @keyframes border-glow-cyan {
        0%, 100% { border-color: rgba(0, 240, 255, 0.2); box-shadow: 0 0 10px rgba(0, 240, 255, 0.05); }
        50% { border-color: rgba(0, 240, 255, 0.6); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      .flicker {
        animation: flicker 0.15s infinite;
      }
      @keyframes flicker {
        0% { opacity: 0.98; }
        50% { opacity: 1; }
        100% { opacity: 0.99; }
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px #e8788a44, 0 0 40px #e8788a22; }
        50% { box-shadow: 0 0 30px #e8788a66, 0 0 60px #e8788a33; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes particle-float {
        0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes landing-zoom {
        to { transform: scale(1.5); filter: blur(20px); opacity: 0; }
      }
      @keyframes count-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes border-glow {
        0%, 100% { border-color: #e8788a33; }
        50% { border-color: #e8788a66; }
      }
      @keyframes wave-hand {
        0%, 60%, 100% { transform: rotate(0deg); }
        10%, 30% { transform: rotate(14deg); }
        20% { transform: rotate(-8deg); }
        40% { transform: rotate(-4deg); }
        50% { transform: rotate(10deg); }
      }
      @keyframes grid-move {
        0% { transform: perspective(500px) rotateX(45deg) translateY(0); }
        100% { transform: perspective(500px) rotateX(45deg) translateY(60px); }
      }
      @keyframes typewriter-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glow-ring {
        0%, 100% { box-shadow: 0 0 30px #e8788a33, 0 0 60px #e8788a11, inset 0 0 30px #e8788a11; }
        50% { box-shadow: 0 0 50px #e8788a55, 0 0 100px #e8788a22, inset 0 0 50px #e8788a22; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
        to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
      }
      @keyframes slide-up-stagger {
        from { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(6px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      @keyframes landing-exit {
        0% { opacity: 1; transform: scale(1); filter: blur(0); }
        100% { opacity: 0; transform: scale(1.1); filter: blur(30px); }
      }
      @keyframes ripple {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      @keyframes subtle-rotate {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes petal-fall {
        0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
        25% { transform: translateY(25vh) rotate(90deg) translateX(30px); opacity: 0.8; }
        50% { transform: translateY(50vh) rotate(180deg) translateX(-20px); opacity: 0.7; }
        75% { transform: translateY(75vh) rotate(270deg) translateX(25px); opacity: 0.4; }
        100% { transform: translateY(110vh) rotate(360deg) translateX(-10px); opacity: 0; }
      }
      @keyframes music-bar {
        0% { height: 3px; }
        100% { height: 14px; }
      }
      @keyframes rewind-flash {
        0% { opacity: 0; }
        15% { opacity: 0.7; }
        40% { opacity: 0.3; }
        60% { opacity: 0.5; }
        80% { opacity: 0.15; }
        100% { opacity: 0; }
      }
      @keyframes rewind-lines {
        0% { background-position: 0 0; }
        100% { background-position: 0 -200px; }
      }
      @keyframes shape-drift {
        0%, 100% { transform: var(--base-transform) translateY(0px) translateX(0px); }
        33% { transform: var(--base-transform) translateY(-15px) translateX(8px); }
        66% { transform: var(--base-transform) translateY(10px) translateX(-6px); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.03; transform: scale(1); }
        50% { opacity: 0.07; transform: scale(1.15); }
      }
      @keyframes icon-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Sora',sans-serif;">
        <p style="color:#e8788a;font-size:1.2rem;animation:shimmer 3s linear infinite;background:linear-gradient(90deg,#e8788a,#f5c542,#e8788a);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
